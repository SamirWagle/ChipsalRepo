# Pre-commit Configuration
# Install: pip install pre-commit && pre-commit install

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=100]
        exclude: ^(chipsal_env/|build/|dist/)

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        exclude: ^(chipsal_env/|build/|dist/)

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [
          --max-line-length=100,
          --extend-ignore=E203 E266 E501 W503,
          --max-complexity=15
        ]
        exclude: ^(chipsal_env/|build/|dist/|__pycache__/)

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [types-all]
        exclude: ^(chipsal_env/|build/|dist/|tests/)

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-r, abiral, samir, scripts]
        exclude: ^(chipsal_env/|tests/)

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        args: [--safe]
        exclude: ^(chipsal_env/)
      - id: check-json
        exclude: ^(chipsal_env/)
      - id: check-toml
        exclude: ^(chipsal_env/)
      
      # File checks
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(chipsal_env/|.*\.ipynb$)
      - id: trailing-whitespace
        exclude: ^(chipsal_env/|.*\.ipynb$)
      
      # Python-specific
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^(chipsal_env/|tests/test_utils/)

  # Notebook cleaning
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: \\.ipynb$
        args: [--extra-keys=metadata.kernelspec metadata.language_info]

  # Docstring formatting
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [
          --convention=google,
          --add-ignore=D100 D104 D107,
        ]
        exclude: ^(chipsal_env/|tests/|setup.py)

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: ^(chipsal_env/|CHANGELOG.md)

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        exclude: ^(chipsal_env/)

# Configuration
default_language_version:
  python: python3.10

default_stages: [commit]

# Exclude patterns
exclude: |
  (?x)^(
    chipsal_env/|
    build/|
    dist/|
    .*\.egg-info/|
    __pycache__/|
    \.pytest_cache/|
    \.mypy_cache/|
    \.git/|
    outputs/|
    Output/|
    data/|
    train/train_images/|
    val/|
    test_release/|
    .*\.pyc$|
    .*\.pyo$|
    .*\.so$|
    .*\.pt$|
    .*\.pth$|
    .*\.ckpt$
  )

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
    
    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [mypy, bandit]  # Skip slow checks in CI
  submodules: false
