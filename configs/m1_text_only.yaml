# M1: Text-Only Baseline (BGE-M3)
# Paper: Table 4, Row 2
# Expected F1-Macro: 0.6455

experiment_name: m1_text_only
model_type: text_only

# Encoder Configuration
text_encoder:
  model_name: "BAAI/bge-m3"
  freeze: false
  unfreeze_last_n_layers: 4

# Model Architecture
architecture:
  hidden_dims: [1024, 512, 256]
  dropout: 0.3
  activation: relu

# Training Configuration
training:
  num_epochs: 25
  batch_size: 64
  learning_rate: 3.0e-5
  weight_decay: 1.0e-2
  warmup_steps: 100
  
# Optimizer
optimizer:
  type: AdamW
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Scheduler
scheduler:
  type: ReduceLROnPlateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 1.0e-6

# Loss Configuration
loss:
  type: CrossEntropyLoss
  label_smoothing: 0.1
  class_weight_gamma: 0.3  # Frequency-inverse weighting

# Data Configuration
data:
  max_length: 77
  train_csv: "train/train.csv"
  image_dir: "train/train_images/"
  text_column: "text"
  label_column: "label"
  image_column: "index"

# Augmentation
augmentation:
  text_aug_prob: 0.1
  back_translation: false
  synonym_replacement: true
  random_deletion: false

# Training Settings
early_stopping:
  patience: 10
  min_delta: 0.001
  mode: max
  metric: f1_macro

# Regularization
regularization:
  gradient_clip_norm: 1.0
  use_amp: true  # Mixed precision training

# Logging
logging:
  log_interval: 10
  save_best_only: true
  save_last: true
  tensorboard: true
  wandb: false

# Cross-Validation
cross_validation:
  k_folds: 5
  stratified: true
  shuffle: true

# Reproducibility
seed: 42

# Hardware
device: cuda
num_workers: 4
pin_memory: true

# Checkpointing
checkpoint:
  save_dir: "outputs/m1_text_only"
  monitor: f1_macro
  mode: max
